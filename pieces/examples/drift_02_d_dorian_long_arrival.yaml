# Audition 2: the slowest crossing: arrival over the whole chord, bass pedal held until 90% have arrived.
# Run:  cd engine && python3 piece.py ../pieces/examples/drift_02_d_dorian_long_arrival.yaml
# Seq Drift sounds only over chords of min_chord_bars or longer, so the harmony is set to four-bar chords.

piece:
  title: "Drift 2: D dorian, long arrival"
  key: D dorian
  tempo: 84
  meter: 4/4
  length: 40
  seed: 8

structure:
  model: evolving
  section_length: 8..16
  phrase_length: 4..8
  intro: false
  bridge: false
  outro: false

harmony:
  rates: [0.25]           # four-bar chords, the slowest the harmony engine writes

pads:
  pad2: {tones: 1-3, voicing: smooth, articulation: hold, low: 55, high: 76}
  pad3: {voicing: smooth, articulation: hold, low: 55, high: 76}

orchestration:
  constant: pad2
  contour: role
  randomness: 0.5
  seed: 3

bass:
  length: 8
  grid: '8'
  transpose: fitted
  reset: section
  mutation: 0.3
  low: 28
  high: 52
  seed: 2

lines:
  enabled: false
  seed: 4

sequencers:
  m960: {enabled: false}
  euclid: {enabled: false}
  poly: {enabled: false}
  tb303: {enabled: false}
  turing: {enabled: false}
  metro: {enabled: false}
  marbles: {enabled: false}
  rene: {enabled: false}
  nodal: {enabled: false}
  drift:
    enabled: true
    arrival: 1.0          # the crossing takes the whole chord
    lag: 0.9              # the bass waits until nearly everything has crossed
    min_chord_bars: 4
    seed: 2

density:
  keep: 100
  mode: even
  parts: {}
  randomness: 0.3
  seed: 1

output:
  folder: drift_02_d_dorian_long_arrival
  score: false
  midi: true
