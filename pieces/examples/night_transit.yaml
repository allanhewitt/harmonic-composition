# Example piece script. Run:  python3 piece.py example_piece.yaml
# Leave any setting out to use its default. Seeds make every random choice repeatable.

piece:
  title: Night Transit
  key: A minor            # tonic and mode: major, minor, dorian, phrygian, lydian, mixolydian, locrian
  tempo: 112
  meter: 4/4
  length: 64              # a target in bars, or a range such as 64..96
  seed: 5

structure:
  model: verse_chorus     # verse_chorus, aaba, cyclic, through_composed, evolving, arch, modular, auto, explicit
  phrase_length: 4..8

harmony:
  rates: [0.25, 0.5]      # chords per bar: 0.25 = four-bar chords, 0.5 = two-bar chords
  interest: 0.5           # 0 predictable ... 1 surprising (0.5 = measured)

pads:
  pad2: {tones: 1-3, voicing: smooth, articulation: hold, low: 55, high: 76}
  pad3: {voicing: smooth, articulation: hold, low: 55, high: 76}

orchestration:            # the shared density plan, used by pads, bass and lines
  constant: pad2          # this pad plays throughout
  contour: role           # role, rising, arch, flat
  randomness: 0.5
  phrase_changes: 0.5     # 0 = change only at section starts
  seed: 3

bass:                     # Moog 960 sequencer bass for the Model D
  length: 8               # steps; odd lengths drift against the bar
  grid: '8'               # '8' quavers, '16' semiquavers
  transpose: fitted       # fitted to chord and scale, or strict
  reset: section          # section, phrase or never
  mutation: 0.3
  low: 28
  high: 52
  seed: 2

lines:
  seed: 4
  tenor:   {low: 45, high: 62}    # Kobol
  alto:    {low: 57, high: 72}    # Poly-800
  descant: {low: 72, high: 88}    # Diva

density:                  # final filter on pads and lines (the constant pad is exempt)
  keep: 100               # share of notes kept, 0-100
  mode: even              # even, flatten, contrast
  parts: {}               # per-part keep, e.g. {descant: 50}
  randomness: 0.3
  seed: 1

output:
  folder: night_transit
  score: true
  midi: true
