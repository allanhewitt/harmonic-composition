name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install LilyPond and poppler (score tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lilypond poppler-utils
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q tests
